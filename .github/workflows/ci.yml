name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Tags, not just the commit: four tests ask what a RELEASE shipped —
      # `test_the_history_covers_what_the_last_release_shipped` and the three
      # in `test_upgrade_from_a_release.py`. Without tags they skip, and a
      # check that skips in CI reports the same green as one that passed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The suite needs gitleaks present, and without it fifteen tests fail
      # for a reason that has nothing to do with the change being tested:
      # `rite doctor` reports "tool gitleaks: not found" as a problem, so
      # every test asserting a healthy project, or counting problems, goes
      # red. CI on main had been failing that way for at least twelve
      # commits, which meant it had stopped being a signal.
      #
      # Pinned and checksummed exactly as `publish-gate.yml` does it — the
      # two workflows install the same tool the same way, and this is the
      # environment a developer already has.
      - name: Install gitleaks
        run: |
          cd /tmp
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt \
            -o gitleaks_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_checksums.txt > expected.sha256
          sha256sum --check expected.sha256
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # THE SAME REASONING AS gitleaks ABOVE, for the defect it let through.
      # 19 tests in `test_loop_start_really_starts.py` skip when tmux is
      # absent, and the runner has no tmux — so they have never executed in
      # CI. They are the ONLY success-path coverage of `loop.session.start`,
      # and `rite loop start` shipped as a facade that printed success while
      # starting nothing. It passed every test it had, because every test
      # that could have caught it either mocked tmux or silently did not run
      # here.
      #
      # This file already says it, twelve lines up: "a check that skips in CI
      # reports the same green as one that passed."
      - name: Install tmux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
          tmux -V

      # ⚠ **THE LINUX SANDBOX EVIDENCE, ON A KERNEL WE DO NOT OWN.** Every
      # Linux claim rite would make was measured on one Ubuntu aarch64 VM that
      # is about to be deleted, and a machine that no longer exists is not
      # evidence. These runners are real **x86_64**, so the same probes run
      # here — and the environment is printed because a result without the
      # architecture, kernel and Landlock ABI cannot be compared with the
      # ARM64 table in docs/design/spikes/B9b-linux-manager-sandboxing.md.
      #
      # Every command is `|| true`-guarded: this step REPORTS, and a machine
      # that lacks bwrap or a sysctl is a finding rather than a broken build.
      - name: Report the Manager sandbox environment
        run: |
          echo "arch:   $(uname -m)"
          echo "kernel: $(uname -r)"
          uv run python -c "from rite_ai.managers import landlock; print('landlock ABI:', landlock.abi())" || true
          uv run rite doctor 2>&1 | grep -i "manager sandbox" || true
          for f in /proc/sys/kernel/apparmor_restrict_unprivileged_userns \
                   /proc/sys/kernel/unprivileged_userns_clone; do
            if [ -r "$f" ]; then echo "$f = $(cat "$f")"; else echo "$f = (absent)"; fi
          done
          if command -v bwrap >/dev/null 2>&1; then bwrap --version; else echo "bwrap: not installed"; fi
          if unshare --user --map-root-user true 2>/dev/null; then
            echo "unprivileged userns: permitted"
          else
            echo "unprivileged userns: refused"
          fi

      # Run separately as well as inside the suite, with `-rs`, so the log
      # carries one labelled block saying which probes ran and — where one
      # could not — why. A silent skip is how a green CI lies.
      - name: Landlock probes
        run: uv run pytest -rs tests/test_landlock_really_confines.py

      # `-rsfE` and a report, for the reason the Landlock step above gives.
      # This step's skips were `s` characters in a progress line — DF3's
      # eleven among them — and `-r` with no `s` prints none of them; `fE`
      # keeps the failure list `-r` would otherwise replace. `--junitxml` is
      # what `every-test-passes-somewhere` reads.
      - name: Test
        run: uv run pytest -rsfE --junitxml=junit.xml
        env:
          # The concurrency soak is clock-bound, and its default is
          # calibrated for a developer laptop. A shared runner measured ~85x
          # slower and did 31 rounds where a laptop does thousands, which
          # put the suite red on a test whose properties had not been
          # violated. Give it a budget that matches the machine it runs on
          # rather than the machine it was written on.
          RITE_SOAK_SECONDS: "20"

      # `always()`: a red test step still leaves a report, and the guard needs
      # it to tell "this test failed" from "no job ran this test". A job that
      # never reached pytest leaves none, which the guard reports as CANNOT
      # TELL rather than as zero tests.
      - name: Keep the junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-lint-and-test-${{ matrix.python-version }}
          path: junit.xml

  # 🔴 **THERE WAS NO macOS CI AT ALL, AND THEN ITS COVERAGE WAS A LIST OF
  # FILENAMES.** A list does not grow when a test is added, and that is the
  # same gap one level down. Measured on `9b59680`: five test files stand down
  # on anything but macOS (`sys.platform != "darwin"`) and are named nowhere
  # in this job. One of them is
  # `tests/test_no_manager_reads_another_managers_mail.py`, whose eleven tests
  # are the whole of DF3 — that no Manager can list or read a sibling's inbox,
  # outbox or state. Linux skipped them, this job never collected them, and
  # both were green, so that property was enforced in no job at all. A test
  # that skips INSIDE a file the list DOES name, on something the runner
  # happens to lack, was invisible the same way.
  #
  # ⚠ **So this job runs the WHOLE suite, and nothing anywhere records what
  # macOS covers.** `every-test-passes-somewhere` below reads what each job
  # actually ran, from its junit report. The named list's stated reason — that
  # a hosted runner has "no tmux, no gitleaks and no credential store" — had
  # stopped holding: tmux and gitleaks are installed here, and credentials are
  # one file store on both platforms (`credentials/file_store.py`).
  #
  # ⚠ **THE NAME IS A REQUIRED CHECK AND MUST NOT CHANGE HERE ALONE.** `main`'s
  # ruleset requires `boundary-and-credentials-on-macos` by name, so the name
  # stays although the job is now the whole suite. A renamed job never reports
  # under the old name, and a required check that never reports blocks every
  # PR — so a rename needs the ruleset edited in the same moment, which is not
  # something this file can do.
  boundary-and-credentials-on-macos:
    runs-on: macos-latest
    # The whole suite took 19 minutes on the first macOS run that tried it
    # (run 36490053348). 45 leaves room for a slower runner while keeping a
    # HANG — an unanswered keychain dialog, a wait on tmux — from running to
    # the 6-hour default, where it costs the queue rather than failing.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Unpinned, the way a user's `uv tool install` is, and so the only job
      # here that covers whatever Python that resolves to today — no Linux
      # matrix entry does. The version is printed below, because a red here
      # may be the interpreter rather than macOS.
      - name: Install dependencies
        run: uv sync

      # ⚠ **THE SAME REASONING THIS FILE ALREADY APPLIES TO THE LINUX JOB.**
      # A hosted macOS runner has no tmux, and `test_no_manager_writes_an_inbox`
      # drives a real one — measured on the first run of this job, where it
      # raised `FileNotFoundError: 'tmux'` rather than skipping. Skipping would
      # have been worse: MM-2 is one of the reasons this job exists, and a skip
      # reports the same green as a pass.
      - name: Install tmux
        run: |
          brew install tmux
          tmux -V

      # Pinned and checksummed exactly as the Linux job and `publish-gate.yml`
      # do it, and for the reason the Linux job gives above: `rite doctor`
      # reports an absent gitleaks as a problem, and the fifteen tests it
      # names go red. The asset's own line is grepped OUT of the checksum file
      # rather than checked with `--ignore-missing`: if the asset name changes,
      # grep exits 1 and the job stops.
      - name: Install gitleaks
        run: |
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            x86_64) arch=x64 ;;
            *) echo "no gitleaks build for $(uname -m)"; exit 1 ;;
          esac
          asset="gitleaks_8.30.1_darwin_${arch}.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${asset}" -o "$asset"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt \
            -o gitleaks_checksums.txt
          grep " ${asset}\$" gitleaks_checksums.txt > expected.sha256
          shasum -a 256 --check expected.sha256
          tar -xzf "$asset" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # W8's run-it test
      # (`test_inside_the_profile_the_operators_gh_config_is_unreadable`) skips
      # where there is no `~/.config/gh/config.yml` to try, and a hosted runner
      # has none — so the deny that keeps a Manager out of the operator's gh
      # login had only ever been checked as profile text. A harmless file here
      # makes the test run for real: readable outside the profile, which is its
      # own control, and refused inside.
      - name: Give the gh-config deny something to protect
        run: |
          mkdir -p ~/.config/gh
          [ -e ~/.config/gh/config.yml ] || printf 'git_protocol: https\n' > ~/.config/gh/config.yml

      - name: Which sandbox backend does macOS pick
        run: |
          echo "arch:   $(uname -m)"
          echo "sw_vers: $(sw_vers -productVersion 2>/dev/null || echo unknown)"
          uv run python -c "import sys; print('python:', sys.version.split()[0])"
          command -v sandbox-exec >/dev/null && echo "sandbox-exec: present" || echo "sandbox-exec: MISSING"
          uv run python -c "from rite_ai.managers.boundaries import describe; print('manager sandbox:', describe())"

      # The whole suite, with every skip printed by name. A silent skip is how
      # a green CI lies, and on this platform the skips are the point: the
      # guard job below reads this report to decide whether anything was left
      # running nowhere.
      - name: Test
        run: uv run pytest -rsfE --junitxml=junit.xml
        env:
          RITE_SOAK_SECONDS: "20"

      - name: Keep the junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-boundary-and-credentials-on-macos
          path: junit.xml

  # 🔴 **EVERY TEST PASSES IN AT LEAST ONE JOB, OR SAYS WHY IT RUNS NOWHERE.**
  # Read from the jobs' junit reports, so it measures what they RAN rather
  # than what this file says they run — the defect it exists for was a file
  # named in no job, which every green in this workflow was compatible with.
  # It fails on a test that passed nowhere, and on a stale, reasonless or
  # vanished entry in `tests/ci_runs_nowhere.toml`. It needs no list of
  # macOS-only tests: such a test skips on Linux, so narrowing the macOS job
  # makes it pass nowhere and turns this red by itself.
  #
  # `tests/test_every_test_passes_somewhere.py` checks the labels below
  # against this file's jobs and matrix, so a new job or Python version cannot
  # be left out of the command.
  every-test-passes-somewhere:
    needs: [lint-and-test, boundary-and-credentials-on-macos]
    # `always()`: the question "did anything run nowhere" is most worth asking
    # when a test job went red, and a skipped guard answers nothing.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `continue-on-error`, deliberately: with no artifact at all this action
      # fails with its own message, and the question "which job's report is
      # missing" is the one worth answering. Letting the step through hands
      # that to the tool, which names the report and says CANNOT TELL. The
      # job still goes red — on exit 2 from the step below.
      - name: Fetch every job's junit report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: junit-*
          path: reports

      # Stdlib only (`tomllib`, `xml.etree`), so the runner's python3 is
      # enough and this job needs no install of rite itself.
      - name: Every test passed somewhere
        run: |
          python3 tools/every_test_passes_somewhere.py \
            --runs-nowhere tests/ci_runs_nowhere.toml \
            lint-and-test-3.11=reports/junit-lint-and-test-3.11/junit.xml \
            lint-and-test-3.12=reports/junit-lint-and-test-3.12/junit.xml \
            lint-and-test-3.13=reports/junit-lint-and-test-3.13/junit.xml \
            boundary-and-credentials-on-macos=reports/junit-boundary-and-credentials-on-macos/junit.xml
