name: Publish gate

# installed-by: rite init
#
# Generated by `rite init` into `.github/workflows/publish-gate.yml` — SPEC
# §11.5: "CI integration: a GitHub Action / JIRA automation that runs the same
# gate. Belt and braces — the hook catches it at the developer's machine, CI
# catches it if the hook is bypassed." `rite init` also TRIES to install a
# pre-push hook that runs the same check locally before code ever reaches the
# remote — and prints a warning instead when git would not read it. Whether
# you have that half is what `rite init` said at the time and what `rite
# doctor` says now; this file cannot know, so it does not claim.
#
# ⚠ The two layers are NOT independent, and this is the load-bearing one
# (SPEC §11.5.1). `core.hooksPath` — set globally by some teams and by some
# tooling — redirects git's hooks wholesale, disarming the local hook without
# any action by the developer and with no signal that it happened. Nothing in
# a local git config can switch this job off. Treat a red or absent run here
# as publish-blocking, not as untidiness.
#
# The two scan different RANGES on purpose, not the same check twice: the
# pre-push hook (`rite publish pre-push`) scans only what's actually being
# pushed, so it stays "seconds to run" (§11) even on a repo with real
# history; this job scans full history on every push/PR, which is the
# actual belt-and-braces case (a bypassed hook, a force-push, history that
# predates the hook's installation). `rite publish check` with no
# `--rev-range` is the full-history form both of these ultimately call.
#
# SCOPE: this file is written into the PROJECT ROOT repo only, even on a
# project with modules that are their own checkouts. The gate reads its
# scan patterns from `.rite/config.yaml` and its suppressions from
# `.rite/gitleaksignore` (written on the first suppression, not by `rite
# init`), and both live at the project root — a module repo
# built alone in CI would find neither, re-flag every finding the project
# already suppressed with a reason, and go red for no reason.
#
# So a module repo that pushes to its own remote is covered here by nothing.
# The pre-push hook `rite init` installs in each module repo is the only rite
# layer it gets — a different range (what is being pushed, not full history),
# and only where git will read it. If you want a gate in that repo's own CI,
# give it its own `.rite/` and copy this file in.
#
# Not GitHub? This is the GitHub Actions form. `rite publish check` is the
# whole gate — any CI system that can install rite and run one command can
# run it; the exit codes are 0 clean / 1 warn / 2 fail / 3 the gate could
# not run at all.

# Deliberately UNFILTERED — every push, every pull request, every branch.
#
# `branches: [main]` was the first draft and it is wrong twice. It is wrong
# on any project whose root branch is not called `main`: the workflow is
# committed, is valid, and fires for nothing, which is §11.5.1's "reports
# itself installed while being entirely inactive" one layer up. And it is
# wrong even on a `main` project, because a Worker never pushes to the root
# branch (that is forbidden in its own generated instructions) — so every
# push this gate exists to catch lands on a feature branch, where a filtered
# trigger would not run. A secret is published the moment it reaches the
# remote, not the moment it is merged.
#
# The cost is a duplicate run on a same-repo PR's head branch. That is the
# correct trade for the one layer no local git config can switch off.
on: [push, pull_request]

# The gate reads a checkout and writes nothing. Narrowed explicitly rather
# than inheriting whatever this repository's default token scope happens to
# be.
permissions:
  contents: read

jobs:
  publish-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the gate scans all of it, not just HEAD

      # Pinned AND checksummed. A release asset can be replaced under an
      # unchanged tag, and this binary is not a build tool here — it IS the
      # security control this job exists to run. `checksums.txt` is
      # published with every gitleaks release.
      #
      # The one line for our asset is grepped OUT of that file rather than
      # checking the whole thing with `--ignore-missing`: if the asset name
      # ever changes, grep exits 1 and the job stops, whereas
      # `--ignore-missing` with nothing left to match is a no-op that exits
      # 0 on some implementations. Measured on macOS: GNU coreutils and
      # Perl `shasum` 6.02 both print "no file was verified" and exit 1,
      # while `/sbin/sha256sum` (Darwin 1.0) exits 0 silently. ubuntu-latest
      # has coreutils and is safe either way — but this template invites
      # editing for self-hosted runners, and a verification step that can
      # degrade into a no-op that passes is the one thing it must not be.
      - name: Install gitleaks
        run: |
          cd /tmp
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt \
            -o gitleaks_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_checksums.txt > expected.sha256
          sha256sum --check expected.sha256
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          # Proves it is on PATH and runnable, not merely downloaded — the
          # gate exits 3 ("could not run at all") without it, and a job that
          # went red there would be red for the wrong reason.
          gitleaks version

      # rite is NOT on PyPI yet (see its README, "Install"), so `pipx install
      # rite-ai` fails here — the distribution does not exist to install. It
      # is installed from the pinned git tag instead: the same source, and
      # the same tag, that `install.sh` uses. pipx gives it its own isolated
      # environment, which is what keeps it from colliding with PyPI's
      # unrelated `rite` package. Once rite-ai is published this becomes
      # `pipx install "rite-ai==<version>"` — still pinned, same reason.
      - name: Install rite
        run: pipx install "{{RITE_INSTALL_SPEC}}"

      - name: Run publish gate
        # --strict: in CI, a finding that predates this push or a
        # suppression matching nothing is worth failing the build over —
        # nobody has looked at it. The pre-push hook deliberately does NOT
        # pass this, because stopping someone's unrelated push is the
        # behaviour the gate promises not to have.
        run: rite publish check --strict
