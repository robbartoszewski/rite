# The happy-path SMOKE (Robert, 2026-10-08): one trivial ticket, no induced
# failures, four transitions asserted. Narrower than the full gate on purpose —
# the point is to SEE the local/GPU loop work end to end in this fleet shape.
#
# Nothing is mocked: a real board, a real model through a real Ollama endpoint,
# a real sandbox, a real commit, and rite's own verify deciding it.

project_name: e2e-smoke-mixed

scenario:
  name: smoke_mixed
  title: "Smoke A — Claude Manager + GPU Worker (the a9 gap SCRUM-72/79 fixed)"
  smoke: true                  # run until the one ticket is delivered; no inductions
  pipeline_tickets: [gpu-slug]
  kill_worker: ""              # no kill, and so no stale-claim restart either
  # The app has NO git remote, which is the only shape in which a Worker's
  # sandbox starts without a GitHub token of its own
  # (`sandbox.start_problem`: a non-GitHub remote is refused outright,
  # "if not remotes: return None"). Delivery therefore lands as a branch in the
  # project's own checkout. The host collects a Worker's branch either way
  # (OL5b), so what this skips is the push and the PR, not the handover.
  board_only_repo: true
  publish_strategy: commit
  checks:
    - dispatched_to_the_gpu_worker
    - went_through_the_review_gates
    - delivered_and_handed_back
    - the_manager_picked_it_up

github:
  owner: robbartoszewski
  repo_prefix: rite-smoke-smoke_mixed-
  # No GitHub App: see the full scenarios. Delivery here does not open a PR.

managers:
  # 🔴 **The reliable split, measured (SCRUM-83 refined + SCRUM-91).**
  # `lead` (Claude) is the Owner: it claims the ticket, asks for the GPU
  # Worker, OWNS it and drives its ticket through the staged pipeline — and it
  # approves the plan. Step 1 is a reasoning bar that a Claude Manager clears
  # in minutes and a local one clears only sometimes (17 min once, still
  # wandering at 43 another time; 14b and 8b not at all), so it belongs here.
  # `planner` (local 17 GB) holds `decompose` ONLY: it authors the plan, which
  # is the job the local tier exists for and the one a local model did well —
  # it produced a valid two-subtask plan with verifies it had checked fail.
  # The Worker implements.
  #
  # RL-6/DD-3.5 hold: the author (planner, local) and the approver (lead,
  # Claude) are different Managers on different engines. The approval is
  # engine-agnostic, which is what SCRUM-72 exists to prove.
  #
  # ⚠ `lead` holds no `decompose`, so it DELEGATES authoring to `planner` —
  # which is exactly the rule SCRUM-83 was refined to allow.
  - name: lead
    duties: "decide,board,route,spec,integrate,plan-review"
  - name: planner
    duties: "decompose"
    engine: "local:large"
    endpoint: "http://localhost:11434"
    model: "qwen3.8:latest"
    agent: goose
    context_window: 32768

workers:
  # 🔴 **The release-gate composition (Robert, 2026-10-09): a Claude Manager,
  # a Claude Worker and a GPU Worker.** Both Workers report to `lead`, which
  # owns and drives them; `planner` only authors the GPU ticket's plan.
  #
  # This also exercises SCRUM-72 in BOTH directions, which is what it was for:
  # the local tier drives `gpu1`'s ticket and never touches `alpha`'s, because
  # `_local_tier_tickets` filters on the Worker's `needs_authored_plan`
  # capability rather than on the Manager's engine.
  - name: alpha
    manager: lead
  - name: gpu1
    manager: lead
    engine: "local:small"
    endpoint: "http://localhost:11434"
    model: "qwen3.8:latest"
    agent: goose
    context_window: 32768

heartbeat:
  interval_minutes: 2
  stall_threshold: 2

run:
  # 🔴 **Sized from a measurement, not a guess.** One plan-authoring turn by
  # the 17 GB model took 45 minutes on this machine and then failed with an
  # infrastructure fault (a localhost "network error", the signature of the
  # model being evicted mid-generation). The pipeline needs a turn per stage —
  # author, approach, step, recompose — plus the approver's own cycles, and a
  # 120-minute window could not fit the first stage twice. Robert, 2026-10-08:
  # the point is to SEE pure-local deliver once, so the window is long enough
  # that slowness cannot be mistaken for a wall.
  deadline_minutes: 480
  poll_seconds: 20
  start_planner_loop: true
  # The approver's model and the author's do not both fit on this GPU,
  # so it is not started until there is a plan for it to review.
  defer_idle_managers: true
  timezone: Europe/Warsaw

yoloai:
  patched_bin_dir: ~/.local/opt/yoloai-0.11.0-broad
  patched_version_marker: "-broad"

fixed_build:
  min_version: "0.7.0a10"
  probes:
    - {fix: SCRUM-72, argv: [plan, --help], expect: "approve"}
    - {fix: SCRUM-64, python: "import rite_ai.managers.reconcile"}
    # 🔴 **BEHAVIOUR, NOT A VERSION STRING.** The version above did not change
    # across any of these fixes, and `uv tool install --force` does not rebuild
    # when it is unchanged — so a run can report the right version while running
    # the old code. Each probe below asserts the FIX, and every one of them was
    # found by the run that these replace.
    - fix: SCRUM-93
      python: |
        from rite_ai.managers.supervise import COORDINATION
        from rite_ai.managers.progress import Footprint
        import inspect
        assert "pipeline" in COORDINATION, "advancing the pipeline is not progress"
        assert "pipeline" in Footprint.__dataclass_fields__
        assert "__dataclass_fields__" in inspect.getsource(Footprint.differs_from), \
            "differs_from still compares a hardcoded field list"
    - fix: SCRUM-95
      python: |
        import tempfile
        from rite_ai.local.harness import VerifyResult
        from rite_ai.local.runners import SubprocessVerifier
        assert "ran" in VerifyResult.__dataclass_fields__
        r = SubprocessVerifier().run("rite-no-such-program --version", tempfile.mkdtemp())
        assert r.ran is False and r.passed is False, "a missing program reads as a failure"
    - fix: SCRUM-96
      python: |
        import inspect
        from rite_ai.local.harness import Commit, run_subtask
        from rite_ai.local import loop
        assert "nothing_to_commit" in Commit.__dataclass_fields__
        assert "accepted with no commit" in inspect.getsource(run_subtask)
        assert 'getattr(result, "lines", ())' in inspect.getsource(loop.advance_ticket), \
            "the loop still drops the step's own reason"
    - fix: SCRUM-92-remedy
      python: |
        import inspect
        from rite_ai.spec.slice import unit_text
        assert "rite spec index" in inspect.getsource(unit_text)
    - fix: SCRUM-83
      python: |
        from rite_ai.config.managers import ManagerRole
        from rite_ai.local.decompose import author_for
        roles = [ManagerRole(name="lead", engine="claude", preset="lead"),
                 ManagerRole(name="planner", engine="local:large", duties=("decompose",))]
        assert author_for(roles, "lead") == ("planner", ""), "the owner does not delegate"
        who, why = author_for([roles[0]], "lead")
        assert who == "" and "no Manager in this project does" in why
