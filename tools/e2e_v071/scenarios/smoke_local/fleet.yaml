# The happy-path SMOKE (Robert, 2026-10-08): one trivial ticket, no induced
# failures, four transitions asserted. Narrower than the full gate on purpose —
# the point is to SEE the local/GPU loop work end to end in this fleet shape.
#
# Nothing is mocked: a real board, a real model through a real Ollama endpoint,
# a real sandbox, a real commit, and rite's own verify deciding it.

project_name: e2e-smoke-local

scenario:
  name: smoke_local
  title: "Smoke B — local Manager + GPU Worker (pure-local)"
  smoke: true                  # run until the one ticket is delivered; no inductions
  pipeline_tickets: [gpu-slug]
  kill_worker: ""              # no kill, and so no stale-claim restart either
  # The app has NO git remote, which is the only shape in which a Worker's
  # sandbox starts without a GitHub token of its own
  # (`sandbox.start_problem`: a non-GitHub remote is refused outright,
  # "if not remotes: return None"). Delivery therefore lands as a branch in the
  # project's own checkout. The host collects a Worker's branch either way
  # (OL5b), so what this skips is the push and the PR, not the handover.
  board_only_repo: true
  publish_strategy: commit
  checks:
    - dispatched_to_the_gpu_worker
    - went_through_the_review_gates
    - delivered_and_handed_back
    - the_manager_picked_it_up

github:
  owner: robbartoszewski
  repo_prefix: rite-smoke-smoke_local-
  # No GitHub App: see the full scenarios. Delivery here does not open a PR.

managers:
  # 🔴 **Duties, not presets, and the split is load-bearing.** rite decides
  # three things independently, and a smoke needs them to line up:
  #   - the Manager that STARTS a Worker owns it ("'gpu1' was started for
  #     Manager 'lead', not you; only the Manager that asked for a Worker may
  #     stop, restart, destroy, inspect or gate it");
  #   - only the DECOMPOSE duty holder can author a plan;
  #   - the local tier only drives a ticket held by a local Worker OF THE
  #     MANAGER whose cycle is running.
  # So the Worker's starter, its owner and its plan author must be ONE Manager.
  # The shipped presets put `decompose` on `planner` and `plan_review` on
  # `lead`, and `lead` is the one with `board`/`route` that picks the ticket up
  # and asks for the Worker — so out of the box no Manager could advance the
  # ticket past `defined`. Measured twice: once with the Worker under `lead`
  # ("'lead' does not hold the decompose duty"), once with it moved to
  # `planner` (the ownership refusal above).
  #
  # RL-6/DD-3.5 still hold: the plan's approver is a DIFFERENT Manager, on a
  # different engine. It simply is not the author.
  - name: lead
    # The Owner: picks the ticket up, asks for the Worker, owns it, and authors
    # its plan. Robert, 2026-10-08: assess the ~17 GB model in this seat — it
    # is the step-1 bar a qwen3:14b failed (placeholder refinement questions,
    # a malformed command, a session that made no progress).
    duties: "decide,board,route,spec,decompose,integrate,execute"
    engine: "local:large"
    endpoint: "http://localhost:11434"
    model: "qwen3.8:latest"
    agent: goose
    context_window: 32768
  - name: planner              # writes the GPU Worker's plan (decompose)
    duties: "plan-review,step-review"
    engine: "local:small"
    endpoint: "http://localhost:11434"
    model: "qwen3:8b"
    agent: goose
    context_window: 32768

workers:
  - name: gpu1
    # 🔴 **Reports to `planner`, not `lead`, and that is load-bearing.** The
    # local tier's driver only sees a ticket held by a local Worker of the
    # Manager whose cycle is running (`_local_worker_holds`), and only the
    # DECOMPOSE duty holder can author a plan. With the Worker under `lead`:
    # lead saw the ticket and could not decompose it ("'lead' does not hold
    # the decompose duty — holders: planner"), planner held the duty and never
    # saw the ticket. No Manager could advance it past `defined`.
    #
    # RL-6 forces two Managers (author != approver, on different models), so
    # the Worker necessarily sits with one of them — and it has to sit with the
    # AUTHOR. `lead` can still start it: `broker.decide`'s `known_worker` asks
    # whether a Worker exists, not whose it is.
    manager: lead
    engine: "local:small"
    endpoint: "http://localhost:11434"
    model: "qwen3.8:latest"
    agent: goose
    context_window: 32768

heartbeat:
  interval_minutes: 2
  stall_threshold: 2

run:
  deadline_minutes: 120
  poll_seconds: 20
  start_planner_loop: true
  timezone: Europe/Warsaw

yoloai:
  patched_bin_dir: ~/.local/opt/yoloai-0.11.0-broad
  patched_version_marker: "-broad"

fixed_build:
  min_version: "0.7.0a10"
  probes:
    - {fix: SCRUM-72, argv: [plan, --help], expect: "approve"}
    - {fix: SCRUM-64, python: "import rite_ai.managers.reconcile"}
