[project]
name = "tally"
version = "0.1.0"
description = "A throwaway app for rite's v0.7.1 acceptance gate. Not a product."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
